# =============================================================================
# Configuration de ragifix
# Aucun secret ici : uniquement des références à des variables
# d'environnement (champs `*_env`).
#
# ragifix ne connaît AUCUNE notion de "source" : il ne fait qu'exposer une
# API pour ajouter/supprimer/interroger des documents. C'est le rôle de
# ragifix-collector (projet séparé) de lui envoyer du contenu.
# =============================================================================

chunking:
  # Découpage par nombre de tokens avec chevauchement.
  strategy: token
  chunk_size: 512
  chunk_overlap: 64

embedding:
  backend: fastembed              # fastembed (local) | openai_compatible (distant)

  fastembed:
    model: BAAI/bge-small-en-v1.5

  openai_compatible:
    base_url: "https://api.example.com/v1"
    api_key_env: EMBEDDING_API_KEY
    model: text-embedding-3-small

vectorstore:
  backend: milvus

  milvus:
    # IMPORTANT : en mode "lite", ce fichier ne peut être ouvert que par un
    # SEUL process à la fois. Ne jamais lancer deux instances de ragifix
    # (ni plusieurs workers) pointant vers le même lite_path. Pour monter
    # en charge / permettre plusieurs clients concurrents, utiliser
    # mode=server avec un vrai serveur Milvus (host/port).
    mode: lite
    lite_path: /var/lib/ragifix/milvus_lite.db
    # host: localhost
    # port: 19530
    collection_name: ragifix_documents

registry:
  # Registre des documents indexés (doc_id -> chunk_ids/extension/metadata).
  backend: sqlite
  sqlite:
    path: /var/lib/ragifix/registry.db

api:
  host: 127.0.0.1                 # jamais autre chose que localhost
  port: 8421
  auth_token_env: RAGIFIX_API_TOKEN
  default_top_k: 5
  max_document_size_mb: 50        # garde-fou : rejette les corps de requête plus gros

logging:
  level: INFO                     # DEBUG | INFO | WARNING | ERROR
  # Sortie toujours sur stdout : capté nativement par journald (systemd) ou
  # par le driver de logs du conteneur (Docker).
