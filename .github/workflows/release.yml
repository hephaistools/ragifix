name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper dpkg-dev python3 python3-venv python3-pip build-essential

      - name: Gate pytest
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install pytest fastapi pydantic pyyaml tiktoken httpx uvicorn
          pytest

      - name: Extract version from changelog
        id: version
        run: |
          VERSION=$(awk -F'[()]' 'NR==1{print $2}' debian/changelog)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version (changelog) : $VERSION"

      - name: Verify tag matches changelog version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${GITHUB_REF#refs/tags/}"
          TAG="${TAG#v}"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag hors format de version, ignoré : $TAG"
            exit 0
          fi
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Le tag '$TAG' ne correspond pas à la version du changelog '$VERSION'"
            exit 1
          fi
          echo "Version validée : $TAG"

      - name: Build .deb
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          dpkg-buildpackage -us -uc -b
          echo "Artefact : build-artifacts/ragifix_${VERSION}_all.deb"
          ls -1 build-artifacts/ragifix_${VERSION}_all.deb

      - name: Create GitHub release and attach .deb
        env:
          RELEASE_TAG: "${GITHUB_REF#refs/tags/}"
        run: |
          TAG="${RELEASE_TAG#v}"
          VERSION="${{ steps.version.outputs.version }}"
          DEB="$(ls -1 build-artifacts/ragifix_${VERSION}_all.deb | head -n1)"
          echo "Asset : $DEB"
          echo "Tag : $TAG | Repo : $GITHUB_REPOSITORY"

          # Notes de release extraites du changelog (version courante)
          python3 - "$VERSION" <<'PY'
          import sys
          version = sys.argv[1]
          entry, capturing = [], False
          for line in open("debian/changelog", encoding="utf-8").read().splitlines():
              if line.startswith("ragifix ("):
                  capturing = f"({version})" in line
                  continue
              if capturing:
                  entry.append(line)
                  if line.strip().startswith("-- "):
                      break
          body = "## " + version + "\n\n" + "\n".join(entry).strip() + "\n"
          open("release-notes.md", "w", encoding="utf-8").write(body)
          print("Notes de release :")
          print(body)
          PY

          # Corps de la release encodé en JSON (échappement sûr via jq)
          jq -n --arg tag "$TAG" --arg body "$(cat release-notes.md)" \
            '{tag_name: $tag, name: $tag, draft: false, prerelease: false, body: $body}' \
            > release-body.json

          # Suppression d'une release existante (idempotence : run précédent)
          EXISTING_ID=$(curl -sSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            | jq -r '.id // ""')
          if [ -n "$EXISTING_ID" ]; then
            echo "Suppression d'une release existante ($EXISTING_ID)"
            DELETE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$EXISTING_ID")
            if [ "$DELETE_CODE" != "204" ] && [ "$DELETE_CODE" != "404" ]; then
              echo "::error::Échec de la suppression (HTTP $DELETE_CODE)"
              exit 1
            fi
          fi

          # Création de la release
          RESP=$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary "@release-body.json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases")
          POST_CODE=$(printf '%s' "$RESP" | tail -n1)
          POST_BODY=$(printf '%s' "$RESP" | sed '$d')
          if [ "$POST_CODE" = "404" ]; then
            echo "::error::404 sur la création de release : le commit relâché modifie des fichiers sous .github/workflows/ ; le GITHUB_TOKEN ne peut pas les autoriser. Séparer le commit de bump de version des fichiers de workflow, ou autoriser workflows: write."
            exit 1
          fi
          if [ "$POST_CODE" != "201" ]; then
            echo "::error::Échec de la création de la release (HTTP $POST_CODE): $POST_BODY"
            exit 1
          fi
          RELEASE_ID=$(printf '%s' "$POST_BODY" | jq -r '.id')
          echo "Release créée : $RELEASE_ID"

          # Attachement de l'asset .deb
          UPLOAD_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${DEB}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/$RELEASE_ID/assets")
          if [ "$UPLOAD_CODE" != "201" ]; then
            echo "::error::Échec de l'attachement de l'asset (HTTP $UPLOAD_CODE)"
            exit 1
          fi
          echo "Asset attaché : $DEB"
          echo "Release : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
