name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install light dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .
          pip install pytest fastapi pydantic pyyaml tiktoken httpx uvicorn

      - name: Run tests
        run: pytest
